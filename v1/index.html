<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riftbro</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/mithril@2.2.2/mithril.min.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/hover-tilt/dist/hover-tilt.js"></script>

</head>
<body>
    <header>
        <a href="/"><img src="images/logo.png" height="50px" alt="Riftbro"></a>
        <div class="header-buttons">
            <button id="share-btn-header" class="share-btn" title="Share Collection">🔗</button>
            <button id="hamburger" class="hamburger">☰</button>
        </div>
    </header>
    <div id="side-panel" class="side-panel">
        <div class="panel-content">
            <h3>Load Card Data</h3>
            <div id="loading-status" class="loading-status" style="display: none;">
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
                <p id="progress-text">Loading cards...</p>
            </div>
            <button id="load-api-btn">Load from API</button>
            <button id="refresh-api-btn">Refresh Data</button>
            <p id="api-status">Status: Ready</p>
            <hr>
            <h4>Legacy Google Sheets (deprecated)</h4>
            <p id="current-ids">Current sheets: Loading...</p>            
            <input type="text" id="sheet-url-1" placeholder="Enter Google Sheets URL 1" />
            <input type="text" id="sheet-url-2" placeholder="Enter Google Sheets URL 2" />
            <button id="load-btn">Load</button>
            <button id="clear-btn">Clear All Card Data</button>
        </div>
    </div>
    <main>
        
    </main>
    <footer>
        <label for="set-filter">Filter by Set:</label>
        <select id="set-filter">
            <option value="all">All Sets</option>
        </select>
        <label for="missing-filter">Filter by Collection:</label>
        <select id="missing-filter">
            <option value="all">All Cards</option>
            <option value="missing">Missing for Master Set</option>
        </select>
    </footer>

    <script src="src/utils.js"></script>
    <script src="src/loadData.js"></script>
    <script src="src/interactions.js"></script>
    <script src="src/main.js"></script>
    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/src/service-worker.js')
                    .then(registration => {
                        console.log('SW registered: ', registration);
                    })
                    .catch(registrationError => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
    </script>
</body>
</html>
