name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install hub dependencies
        run: npm ci

      - name: Build hub
        run: npm run build

      - name: Install app/ dependencies
        run: npm ci
        working-directory: app

      - name: Build app/
        run: npm run build
        working-directory: app
        env:
          VITE_BASE: /riftbro/app/

      - name: Install give/ dependencies
        run: npm ci
        working-directory: give

      - name: Build give/ app
        run: npm run build
        working-directory: give
        env:
          VITE_BASE: /riftbro/give/

      - name: Install match/ dependencies
        run: npm ci
        working-directory: match

      - name: Build match/ app
        run: npm run build
        working-directory: match
        env:
          VITE_BASE: /riftbro/match/

      - name: Install scan/ dependencies
        run: npm ci
        working-directory: scan

      - name: Build scan/ app
        run: npm run build
        working-directory: scan
        env:
          VITE_BASE: /riftbro/scan/

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist